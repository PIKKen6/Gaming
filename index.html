<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Bibliothèque de Jeux</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --accent: #bb86fc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        h1, h2 {
            text-align: center;
            color: var(--accent);
            margin-top: 40px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .card-content {
            padding: 15px;
        }
        .card-title {
            margin: 0 0 10px 0;
            font-size: 1.2em;
        }
        .rating {
            color: gold;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .comment {
            font-size: 0.9em;
            color: var(--text-muted);
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .link {
            display: inline-block;
            text-decoration: none;
            color: var(--bg-color);
            background-color: var(--accent);
            padding: 8px 12px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.9em;
        }
        .link:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Ma Bibliothèque de Jeux</h1>
        
        <h2>Jeux Terminés</h2>
        <div class="grid">
            <!-- CARTE JEU TERMINÉ -->
            <div class="card">
                <img src="URL_DE_TON_IMAGE_ICI" alt="Image du jeu">
                <div class="card-content">
                    <h3 class="card-title">Nom du Jeu</h3>
                    <div class="rating">⭐⭐⭐⭐⭐ 5/5</div>
                    <div class="comment">"Mon avis ou mes notes sur ce jeu. Très bonne expérience globale."</div>
                    <a href="LIEN_VERS_LE_JEU" class="link" target="_blank">Lien vers le jeu</a>
                </div>
            </div>
            <!-- FIN CARTE JEU TERMINÉ -->
            
            <!-- Pour ajouter un autre jeu, copie-colle le bloc au-dessus ici -->
        </div>

        <h2>Jeux à Faire</h2>
        <div class="grid">
            <!-- CARTE JEU À FAIRE -->
            <div class="card">
                <img src="URL_DE_TON_IMAGE_ICI" alt="Image du jeu">
                <div class="card-content">
                    <h3 class="card-title">Nom du Jeu Attendu</h3>
                    <div class="comment">Ce qui m'attire dans ce jeu ou sa date de sortie.</div>
                    <a href="LIEN_VERS_LE_JEU" class="link" target="_blank">Lien vers le jeu</a>
                </div>
            </div>
            <!-- FIN CARTE JEU À FAIRE -->
        </div>
    </div>
</body>
</html>
