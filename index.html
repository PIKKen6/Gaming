<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Bibliothèque de Jeux</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --accent: #bb86fc;
            --danger: #cf6679;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        h1, h2 {
            text-align: center;
            color: var(--accent);
            margin-top: 40px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* Style du formulaire */
        .form-container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 40px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 5px;
            background-color: #2c2c2c;
            color: white;
            box-sizing: border-box;
        }

        /* NOUVEAU STYLE DU BOUTON D'AJOUT */
        button[type="submit"] {
            background: linear-gradient(45deg, #bb86fc, #7c4dff);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(187, 134, 252, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(187, 134, 252, 0.6);
            background: linear-gradient(45deg, #cda4fd, #8c62ff);
        }

        button[type="submit"]:active {
            transform: translateY(1px) scale(0.98);
        }

        /* Style de la grille et des cartes */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .card-content {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .card-title {
            margin: 0 0 10px 0;
            font-size: 1.2em;
        }
        .rating {
            color: gold;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .comment {
            font-size: 0.9em;
            color: var(--text-muted);
            margin-bottom: 15px;
            line-height: 1.4;
            flex-grow: 1;
        }
        .card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        .link {
            text-decoration: none;
            color: var(--bg-color);
            background-color: var(--accent);
            padding: 8px 12px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.9em;
        }
        .btn-delete {
            background-color: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 8px 12px;
            width: auto;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-delete:hover {
            background-color: var(--danger);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Ma Bibliothèque de Jeux</h1>
        
        <div class="form-container">
            <h2>Ajouter un nouveau jeu</h2>
            <form id="game-form">
                <div class="form-group">
                    <label for="title">Titre du jeu</label>
                    <input type="text" id="title" required>
                </div>
                <div class="form-group">
                    <label for="image">Lien de l'image (URL)</label>
                    <input type="url" id="image" required>
                </div>
                <div class="form-group">
                    <label for="link">Lien vers le jeu (optionnel)</label>
                    <input type="url" id="link">
                </div>
                <div class="form-group">
                    <label for="status">Catégorie</label>
                    <select id="status">
                        <option value="finished">Jeu Terminé</option>
                        <option value="todo">Jeu À Faire</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="rating">Note (ex: 5/5) - Optionnel</label>
                    <input type="text" id="rating">
                </div>
                <div class="form-group">
                    <label for="comment">Commentaire / Avis</label>
                    <textarea id="comment" rows="3" required></textarea>
                </div>
                <button type="submit">➕ Ajouter à ma liste</button>
            </form>
        </div>

        <h2>Jeux Terminés</h2>
        <div class="grid" id="finished-grid"></div>

        <h2>Jeux à Faire</h2>
        <div class="grid" id="todo-grid"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', loadGames);
        document.getElementById('game-form').addEventListener('submit', addGame);

        function loadGames() {
            const games = JSON.parse(localStorage.getItem('mesJeux')) || [];
            const finishedGrid = document.getElementById('finished-grid');
            const todoGrid = document.getElementById('todo-grid');

            finishedGrid.innerHTML = '';
            todoGrid.innerHTML = '';

            games.forEach((game, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                
                let cardHTML = `
                    <img src="${game.image}" alt="${game.title}">
                    <div class="card-content">
                        <h3 class="card-title">${game.title}</h3>
                `;
                
                if (game.status === 'finished' && game.rating) {
                    cardHTML += `<div class="rating">⭐ ${game.rating}</div>`;
                }
                
                cardHTML += `
                        <div class="comment">"${game.comment}"</div>
                        <div class="card-actions">
                `;
                
                if (game.link) {
                    cardHTML += `<a href="${game.link}" class="link" target="_blank">Voir</a>`;
                } else {
                    cardHTML += `<span></span>`;
                }

                cardHTML += `
                            <button onclick="deleteGame(${index})" class="btn-delete">Supprimer</button>
                        </div>
                    </div>
                `;
                
                card.innerHTML = cardHTML;

                if (game.status === 'finished') {
                    finishedGrid.appendChild(card);
                } else {
                    todoGrid.appendChild(card);
                }
            });
        }

        function addGame(e) {
            e.preventDefault();
            
            const newGame = {
                title: document.getElementById('title').value,
                image: document.getElementById('image').value,
                link: document.getElementById('link').value,
                status: document.getElementById('status').value,
                rating: document.getElementById('rating').value,
                comment: document.getElementById('comment').value
            };

            const games = JSON.parse(localStorage.getItem('mesJeux')) || [];
            games.push(newGame);
            localStorage.setItem('mesJeux', JSON.stringify(games));

            document.getElementById('game-form').reset();
            loadGames();
        }

        function deleteGame(index) {
            if (confirm("Veux-tu vraiment supprimer ce jeu de ta liste ?")) {
                const games = JSON.parse(localStorage.getItem('mesJeux')) || [];
                games.splice(index, 1);
                localStorage.setItem('mesJeux', JSON.stringify(games));
                loadGames();
            }
        }
    </script>
</body>
</html>
